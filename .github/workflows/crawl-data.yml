name: Crawl public AI pricing data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 20 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: crawl-public-pricing-data
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl public sources
        run: npm run crawl:data

      - name: Commit crawl snapshot
        run: |
          if git diff --quiet -- data/crawl/price-snapshot.json; then
            echo "No crawl snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crawl/price-snapshot.json
          git commit -m "chore: update pricing crawl snapshot"
          git push
